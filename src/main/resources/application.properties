
spring.application.name=gisu-prototype
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/gisu
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cache templates on the deployed server; local profile disables this for development.
spring.thymeleaf.cache=true

# Session cookies are browser-only and HTTPS-only on deployed Railway.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Honor the HTTPS host/protocol forwarded by Railway's ingress.
server.forward-headers-strategy=framework

# Keep error details out of the browser in production.
server.error.include-message=never
server.error.include-stacktrace=never
