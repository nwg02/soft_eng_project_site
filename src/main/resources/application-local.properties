# Only activated with --spring.profiles.active=local or Maven -Dspring-boot.run.profiles=local.
# File-backed H2 database keeps accounts and session-related records between restarts.
# Production application.properties / Railway MySQL datasource is not changed.
spring.datasource.url=jdbc:h2:file:./gisu-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=ROLE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:local-schema.sql

# Local development runs over http://localhost (not HTTPS).
server.servlet.session.cookie.secure=false
spring.thymeleaf.cache=false
