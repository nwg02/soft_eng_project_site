name: GISU assessment checks
on:
  push:
    branches:
      - feature/georgia-health-marketplace-redesign
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Spring Boot assessment and plan explorer
        run: mvn -B -ntp test
